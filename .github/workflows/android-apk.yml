name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Optional HTTPS backend URL. Leave empty for offline/local play."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Personal-install Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout entire workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and licenses
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Configure optional online backend
        env:
          APK_BACKEND_URL: ${{ inputs.backend_url }}
        run: node artifacts/snack-ladder-mobile/scripts/android-build-config.mjs

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check APK configuration and mobile types
        run: |
          node --test artifacts/snack-ladder-mobile/scripts/android-build-config.test.mjs
          pnpm --filter @workspace/snack-ladder-mobile run bundle:web
          pnpm run typecheck:libs
          pnpm --filter @workspace/snack-ladder-mobile run typecheck

      - name: Generate native Android project
        working-directory: artifacts/snack-ladder-mobile
        env:
          NODE_ENV: production
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build bundled release APK
        working-directory: artifacts/snack-ladder-mobile/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew app:assembleRelease --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Verify signed APK and prepare download
        shell: bash
        run: |
          APK="artifacts/snack-ladder-mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify "$APK"
          mkdir -p apk-output
          cp "$APK" apk-output/Snake-Ladder.apk
          (cd apk-output && sha256sum Snake-Ladder.apk > SHA256SUMS.txt)
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## APK ready
          Download **Snake-Ladder-APK** from this run's **Artifacts**, extract the ZIP,
          and open **Snake-Ladder.apk** on Android.

          This is a personal/test installation, signed with Expo's standard debug
          key. It is not a Play Store production release and needs no Expo Go/Metro.
          Do not uninstall an existing copy to resolve an update error: uninstalling
          deletes its local saves. Keep the package ID and signing certificate stable.
          SUMMARY

      - name: Upload installable APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Snake-Ladder-APK
          path: apk-output/
          if-no-files-found: error
          retention-days: 14