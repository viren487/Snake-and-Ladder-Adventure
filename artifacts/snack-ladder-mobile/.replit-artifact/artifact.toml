kind = "mobile"
previewPath = "/snack-ladder-mobile/"
title = "Snake Ladder with Panda"
description = "A native, pass-and-play snake-and-ladder game for two players on one phone, with animated panda tokens, dice turns, collectible keys, torch gates, and saved local progress."
version = "1.0.0"
id = "artifacts/snack-ladder-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/snack-ladder-mobile/" ]
localPort = 20644

[services.development]
run = "pnpm --filter @workspace/snack-ladder-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/snack-ladder-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/snack-ladder-mobile", "run", "serve" ]

[services.env]
PORT = "20644"
BASE_PATH = "/snack-ladder-mobile/"
