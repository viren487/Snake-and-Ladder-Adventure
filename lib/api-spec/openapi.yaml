openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /rooms/admission-ticket:
    post:
      operationId: prepareRoomAdmission
      tags: [multiplayer]
      responses:
        "200":
          description: Cryptographically random recovery credential; save on this device before admission.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdmissionTicket" }
  /rooms:
    post:
      operationId: createGameRoom
      tags: [multiplayer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomCreateInput" }
      responses:
        "201":
          description: Private room created; keep the seat token on this device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomAdmission" }
  /rooms/{code}/join:
    post:
      operationId: joinGameRoom
      tags: [multiplayer]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: "^[A-Z2-9]{6}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomMemberInput" }
      responses:
        "200":
          description: Player admitted, or the same original seat recovered after a lost response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomAdmission" }
  /rooms/{code}:
    get:
      operationId: getGameRoom
      tags: [multiplayer]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      security: [{ RoomSeat: [] }]
      responses:
        "200":
          description: Authoritative round and current player presence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnlineRoom" }
  /rooms/{code}/actions:
    post:
      operationId: actInGameRoom
      tags: [multiplayer]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      security: [{ RoomSeat: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomAction" }
      responses:
        "200":
          description: Validated, atomically committed action; dice are rolled by the server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnlineRoom" }
  /rooms/{code}/communications:
    post:
      operationId: sendRoomCommunication
      tags: [multiplayer]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: "^[A-Z2-9]{6}$" } }
      security: [{ RoomSeat: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomCommunicationInput" }
      responses:
        "200":
          description: Chat message or private peer-to-peer voice signal accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomCommunicationReceipt" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    RoomSeat:
      type: http
      scheme: bearer
  schemas:
    AdmissionTicket:
      type: object
      required: [token]
      properties:
        token: { type: string, pattern: "^[a-f0-9]{64}$" }
    RoomCreateInput:
      type: object
      properties:
        name: { type: string, maxLength: 24 }
        maxPlayers: { type: integer, minimum: 2, maximum: 4, default: 2 }
        admissionToken: { type: string, pattern: "^[a-f0-9]{64}$" }
    RoomMemberInput:
      type: object
      properties:
        name: { type: string, maxLength: 24 }
        admissionToken: { type: string, pattern: "^[a-f0-9]{64}$" }
    RoomSession:
      type: object
      required: [code, token, playerId]
      properties:
        code: { type: string }
        token: { type: string }
        playerId: { type: string }
    RoomAdmission:
      type: object
      required: [session, room]
      properties:
        session: { $ref: "#/components/schemas/RoomSession" }
        room: { $ref: "#/components/schemas/OnlineRoom" }
    RoomAction:
      type: object
      required: [type, actionId, expectedVersion]
      properties:
        type: { type: string, enum: [roll, choose, defense, plant, detonate, extraDice, shoot, web, knife, pass, rematch, leave] }
        actionId: { type: string, minLength: 16, maxLength: 100 }
        expectedVersion: { type: integer, minimum: 0 }
        power: { type: string, enum: [bomb, antiVenom, defuser, webShooter, knife] }
        square: { type: integer, minimum: 1, maximum: 100 }
        bombId: { type: string, maxLength: 100 }
        targetPlayerId: { type: string, minLength: 1, maxLength: 100 }
        use: { type: boolean }
        targets:
          type: array
          minItems: 1
          maxItems: 2
          items: { type: integer, enum: [98, 99] }
    RoomCommunicationInput:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [chat, offer, answer, hangup] }
        text: { type: string, minLength: 1, maxLength: 400 }
        targetPlayerId: { type: string, minLength: 1, maxLength: 100 }
        callId: { type: string, minLength: 16, maxLength: 100 }
        sdp: { type: string, minLength: 1, maxLength: 20000 }
    RoomCommunicationReceipt:
      type: object
      required: [id]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
    RoomChatMessage:
      type: object
      required: [id, playerId, playerName, text, sentAt]
      properties:
        id: { type: string }
        playerId: { type: string }
        playerName: { type: string }
        text: { type: string, maxLength: 400 }
        sentAt: { type: string, format: date-time }
    RoomVoiceSignal:
      type: object
      required: [id, fromPlayerId, toPlayerId, callId, type, sentAt]
      properties:
        id: { type: string }
        fromPlayerId: { type: string }
        toPlayerId: { type: string }
        callId: { type: string }
        type: { type: string, enum: [offer, answer, hangup] }
        sdp: { type: string, maxLength: 20000 }
        sentAt: { type: string, format: date-time }
    OnlineRoomMember:
      type: object
      required: [id, name, online]
      properties:
        id: { type: string }
        name: { type: string }
        online: { type: boolean }
    OnlineRoomEvent:
      type: ["object", "null"]
      required: [kind, playerId, from, roll, path, effect, targets]
      properties:
        kind: { type: string, enum: [roll, choose, defense, plant, detonate, extraDice, shoot, web, knife, pass, rematch, join, leave] }
        playerId: { type: string }
        from: { type: integer }
        sourcePlayerId: { type: string }
        sourcePosition: { type: integer, minimum: 0, maximum: 100 }
        roll: { type: ["integer", "null"] }
        path: { type: array, items: { type: integer } }
        effect: { type: ["string", "null"], enum: [snake, ladder, boom, torch, return, web, knife, null] }
        targets: { type: array, items: { type: integer } }
    OnlineRoom:
      type: object
      required: [code, status, version, game, members, maxPlayers, yourPlayerId, rematchVotes, event, busyForMs, chatMessages, voiceSignals]
      properties:
        code: { type: string }
        status: { type: string, enum: [waiting, playing, finished, closed] }
        version: { type: integer }
        game:
          type: object
          description: Complete shared Snake and Ladder GameState, generated only by the authoritative game engine.
          additionalProperties: true
        members:
          type: array
          items: { $ref: "#/components/schemas/OnlineRoomMember" }
        yourPlayerId: { type: string }
        maxPlayers: { type: integer, minimum: 2, maximum: 4 }
        rematchVotes: { type: array, items: { type: string } }
        event: { $ref: "#/components/schemas/OnlineRoomEvent" }
        busyForMs: { type: integer, minimum: 0 }
        chatMessages:
          type: array
          items: { $ref: "#/components/schemas/RoomChatMessage" }
        voiceSignals:
          type: array
          items: { $ref: "#/components/schemas/RoomVoiceSignal" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

